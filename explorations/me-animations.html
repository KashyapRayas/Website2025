<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait Animations</title>
<style>
  :root {
    --off-white: #FBFFFD;
    --off-black: #121312;
    --off-teal: #C2E9E7;
    --light-off-teal: #ECF8F5;
    --dark-green: #00A084;
    --light-green: #4EDF88;
    --muted: rgba(18, 19, 18, 0.56);
    --line: rgba(18, 19, 18, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--off-white);
    color: var(--off-black);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 16px 24px;
  }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  header p { margin: 0; color: var(--muted); max-width: 640px; line-height: 1.5; font-size: 15px; }
  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 8px 16px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px 20px;
  }
  .card { display: flex; flex-direction: column; gap: 12px; }
  .stage {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: var(--dark-green);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: 2px solid transparent;
    outline-offset: 3px;
    transition: outline-color .2s;
  }
  .card.picked .stage { outline-color: var(--off-black); }
  .stage svg { display: block; width: 100%; height: auto; }
  .chip {
    position: absolute; left: 10px; bottom: 10px;
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .04em; text-transform: uppercase;
    background: var(--off-white); color: var(--off-black);
    padding: 6px 8px; border-radius: 99px;
    opacity: 0; transform: translateY(4px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .chip.on { opacity: 1; transform: none; }
  .meta { display: flex; align-items: baseline; gap: 10px; }
  .num { font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .meta h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; flex: 1; }
  .pick {
    font: inherit; font-size: 12px; font-weight: 500;
    border: 1px solid var(--line); background: transparent; color: var(--off-black);
    padding: 5px 10px; border-radius: 99px; cursor: pointer;
  }
  .pick:hover { border-color: var(--off-black); }
  .card.picked .pick { background: var(--off-black); color: var(--off-white); border-color: var(--off-black); }
  .desc { margin: -4px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .try { font-size: 12.5px; color: var(--off-black); }
  .try b { font-weight: 600; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--off-black); color: var(--off-white);
    font-size: 13px; padding: 12px 16px; text-align: center;
    transform: translateY(100%); transition: transform .3s;
  }
  footer.on { transform: none; }
</style>
</head>
<body>
<header>
  <h1>Portrait animation variants</h1>
  <p>Each one keeps the current blink, then animates one new trait. Hover, move the cursor around and click each portrait. Mark the ones you like with <b>Pick</b>.</p>
</header>
<main id="grid"></main>
<footer id="picked"></footer>

/* ------------------------------------------------------------------ */
/* Tiny animation engine (no dependencies)                             */
/* ------------------------------------------------------------------ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  linear: (t) => t,
  in: (t) => t * t,
  out: (t) => 1 - (1 - t) * (1 - t),
  out3: (t) => 1 - Math.pow(1 - t, 3),
  inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  sine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  back: (t) => { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
// cubic-bezier, used for the site's "wave" CustomEase (M0,0 C0.6,0 0.1,1.4 1,1)
const bezier = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => {
    let t = x;
    for (let i = 0; i < 6; i++) {
      const d = (3 * ax * t + 2 * bx) * t + cx;
      if (Math.abs(d) < 1e-6) break;
      t -= (sx(t) - x) / d;
    }
    return sy(clamp(t, 0, 1));
  };
};
ease.wave = bezier(0.6, 0, 0.1, 1.4);

let now = performance.now();
const tweens = [];
function to(obj, props, dur, fn = ease.out, delay = 0) {
  // overwrite the same keys on the same object
  for (const tw of tweens) if (tw.obj === obj) for (const k in props) delete tw.props[k];
  return new Promise((resolve) => {
    tweens.push({ obj, props: { ...props }, from: null, start: now + delay * 1000, dur: Math.max(1, dur * 1000), fn, resolve });
  });
}
const wait = (s) => new Promise((r) => setTimeout(r, s * 1000));
function stepTweens() {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (now < tw.start) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
    const p = clamp((now - tw.start) / tw.dur, 0, 1);
    const e = tw.fn(p);
    for (const k in tw.props) tw.obj[k] = lerp(tw.from[k], tw.props[k], e);
    if (p >= 1) { tweens.splice(i, 1); tw.resolve(); }
  }
}
const damp = (cur, target, k, dt) => cur + (target - cur) * (1 - Math.exp(-k * dt));

const NUM = /-?\d*\.?\d+(?:e[-+]?\d+)?/gi;
function morpher([a, b]) {
  const na = a.match(NUM).map(Number), nb = b.match(NUM).map(Number), parts = a.split(NUM);
  return (t) => {
    let s = parts[0];
    for (let i = 0; i < na.length; i++) s += (na[i] + (nb[i] - na[i]) * t).toFixed(2) + parts[i + 1];
    return s;
  };
}
const M = { lidR: morpher(P.lidR), botR: morpher(P.botR), lashR: morpher(P.lashR), lidL: morpher(P.lidL), botL: morpher(P.botL), lashL: morpher(P.lashL) };

/* ------------------------------------------------------------------ */
/* Rig: one state object per portrait, one render function for all     */
/* ------------------------------------------------------------------ */
const GAZE0 = { x: 4, y: 1.5 }; // iris offset that reads as "looking at you"
const PIVOT = { head: [205, 345], browL: [133, 215], browR: [214, 222], fisherTop: [117, 32] };

function makeRig() {
  return {
    gx: GAZE0.x, gy: GAZE0.y, pupil: 1,
    closeL: 0, closeR: 0, blink: 0, blinkL: 0,
    bLy: 0, bLr: 0, bRy: 0, bRr: 0,
    hr: 0, hx: 0, hy: 0,
    breathe: 0,
    hairR: 0, hairX: 0, hairY: 0,
    fishSy: 1.02,
    bars: [1, 1, 1, 1], barsX: 0, barsY: 0,
    bodyX: 0, bodyY: 0,
    blush: 0,
  };
}

function bind(svg) {
  const q = (n) => svg.querySelector(`[data-p="${n}"]`);
  return {
    bars: [...svg.querySelectorAll('[data-p="bar"]')], barsG: q("bars"),
    body: q("body"), head: q("head"), hair: q("hair"), fisher: q("fisher"), water: q("water"),
    irisL: q("irisL"), irisR: q("irisR"), lidL: q("lidL"), lidR: q("lidR"), botL: q("botL"), botR: q("botR"), lashL: q("lashL"), lashR: q("lashR"),
    browL: q("browL"), browR: q("browR"), blushL: q("blushL"), blushR: q("blushR"),
    fx: q("fx"),
  };
}

const f = (n) => n.toFixed(2);
function setAttr(el, name, val, cache, key) {
  if (cache[key] === val) return;
  cache[key] = val;
  el.setAttribute(name, val);
}

function render(r, e, cache) {
  const eyeClose = (base, b) => base + (1 - base) * b;
  const cL = eyeClose(r.closeL, Math.max(r.blink, r.blinkL));
  const cR = eyeClose(r.closeR, r.blink);
  setAttr(e.lidL, "d", M.lidL(cL), cache, "lidL");
  setAttr(e.lashL, "d", M.lashL(cL), cache, "lashL");
  setAttr(e.botL, "d", M.botL(Math.max(0, cL)), cache, "botL");
  setAttr(e.lidR, "d", M.lidR(cR), cache, "lidR");
  setAttr(e.lashR, "d", M.lashR(cR), cache, "lashR");
  setAttr(e.botR, "d", M.botR(Math.max(0, cR)), cache, "botR");

  const iris = (cx, cy, k) => `translate(${f(r.gx * k)} ${f(r.gy * k)}) translate(${cx} ${cy}) scale(${f(r.pupil)}) translate(${-cx} ${-cy})`;
  setAttr(e.irisL, "transform", iris(135, 237.5, 1), cache, "irisL");
  setAttr(e.irisR, "transform", iris(213, 245.5, 1), cache, "irisR");

  const brow = (p, y, rot) => `translate(0 ${f(y)}) rotate(${f(rot)} ${p[0]} ${p[1]})`;
  setAttr(e.browL, "transform", brow(PIVOT.browL, r.bLy, r.bLr), cache, "browL");
  setAttr(e.browR, "transform", brow(PIVOT.browR, r.bRy, r.bRr), cache, "browR");

  const by = -r.breathe * 2.2;
  const headT = `translate(${f(r.hx)} ${f(r.hy + by)}) rotate(${f(r.hr)} ${PIVOT.head[0]} ${PIVOT.head[1]})`;
  const hairT = `translate(${f(r.hairX)} ${f(r.hairY)}) rotate(${f(r.hairR)} 215 260)`;
  setAttr(e.head, "transform", headT, cache, "head");
  setAttr(e.body, "transform", `translate(${f(r.bodyX)} ${f(r.bodyY)}) translate(0 480) scale(1 ${f(1 + r.breathe * 0.012)}) translate(0 -480)`, cache, "body");
  setAttr(e.hair, "transform", hairT, cache, "hair");
  // the boat stays put, but its waterline mask belongs to the pool: it rides with head + hair,
  // so a rising or tilting pool swallows more of the hull
  setAttr(e.water, "transform", `${headT} ${hairT}`, cache, "water");
  // fisherman, boat and line live outside the head: only the site's original bob, nothing else
  setAttr(e.fisher, "transform", `translate(${PIVOT.fisherTop[0]} ${PIVOT.fisherTop[1]}) scale(1 ${f(r.fishSy)}) translate(${-PIVOT.fisherTop[0]} ${-PIVOT.fisherTop[1]})`, cache, "fisher");

  setAttr(e.barsG, "transform", `translate(${f(r.barsX)} ${f(r.barsY)})`, cache, "barsG");
  e.bars.forEach((b, i) => setAttr(b, "transform", `scale(1 ${f(r.bars[i])})`, cache, "bar" + i));

  setAttr(e.blushL, "opacity", f(r.blush), cache, "blushL");
  setAttr(e.blushR, "opacity", f(r.blush), cache, "blushR");
}

/* Shared behaviours ------------------------------------------------- */
function blinkOnce(r, key = "blink") {
  return to(r, { [key]: 1 }, 0.1, ease.in).then(() => wait(0.05)).then(() => to(r, { [key]: 0 }, 0.12, ease.out));
}
function autoBlink(card, opts = {}) {
  let prev = "single";
  const loop = async () => {
    while (true) {
      await wait((opts.min ?? 1.6) + Math.random() * (opts.spread ?? 1.6));
      if (!card.visible || card.noBlink) continue;
      const x = Math.random();
      const bias = prev === "triple" ? 0.55 : prev === "double" ? 0.45 : 0.35;
      const n = x < bias ? 1 : x < bias + (1 - bias) / 2 ? 2 : 3;
      for (let i = 0; i < n; i++) { blinkOnce(card.rig); await wait(i === 0 ? 0.3 : 0.52); }
      prev = ["single", "double", "triple"][n - 1];
    }
  };
  loop();
}
// the current site: header bars wave (staggered, yoyo) + fisherman bob
function ambient(r, t) {
  const tt = t % 5.5, ft = tt < 2.75 ? tt : 5.5 - tt;
  for (let i = 0; i < 4; i++) r.bars[i] = 1 + 0.4 * ease.wave(clamp((ft - 0.25 * i) / 2, 0, 1));
  r.fishSy = 1.03 - 0.01 * Math.cos((t / 3) * Math.PI * 2);
}
// pointer in svg units, or null when outside the card
function svgPoint(card) {
  const p = pointer;
  if (!p) return null;
  const pt = card.svg.createSVGPoint();
  pt.x = p.x; pt.y = p.y;
  return pt.matrixTransform(card.svg.getScreenCTM().inverse());
}
function gazeToward(card, sp, range = 1) {
  // aim from between the eyes
  const dx = sp.x - 174, dy = sp.y - 241, d = Math.hypot(dx, dy) || 1;
  const s = Math.min(d, 160) / 160;
  return { x: GAZE0.x + (dx / d) * s * 5 * range, y: GAZE0.y + (dy / d) * s * 2.6 * range };
}

      if (card.mood === 2) g = { x: GAZE0.x + Math.sign(Math.sin(t * 0.9)) * 5, y: GAZE0.y + 0.5 }; // side-eye
      if (card.mood === 3) r.hy = -1 + Math.sin(t * 5) * 0.8; // little bounce
      r.gx = damp(r.gx, g.x, card.mood === 2 ? 5 : 8, dt);
      r.gy = damp(r.gy, g.y, 8, dt);
    },
  },
  {
    key: "sleepy",
    title: "Dozes off",
    desc: "Leave the cursor off it and the lids get heavy, the head nods forward, then it falls asleep with floating Zs. Move over it to startle it awake.",
    tryText: "<b>Wait</b> about 3 seconds, then <b>hover</b> to wake it.",
    setup(card) {
      autoBlink(card, { min: 1.4, spread: 1.4 });
      card.lastActive = now;
      card.state = "awake";
      card.nextZ = 0;
      const wake = async () => {
        const was = card.state;
        card.lastActive = now;
        if (was === "awake" || was === "waking") return;
        card.state = "waking";
        card.noBlink = true;
        const r = card.rig;
        await to(r, { closeL: -0.3, closeR: -0.3, bLy: -9, bRy: -9, hr: -1.2, hy: -4, pupil: 0.8 }, 0.18, ease.out3);
        await wait(0.35);
        to(r, { hr: 0, hy: 0, bLy: 0, bRy: 0, closeL: 0, closeR: 0, pupil: 1 }, 0.6, ease.inOut);
        await wait(0.3);
        await blinkOnce(r); await wait(0.15); await blinkOnce(r);
        card.noBlink = false;
        card.state = "awake";
        card.lastActive = now;
      };
      card.stage.addEventListener("pointermove", wake);
      card.stage.addEventListener("pointerdown", wake);
    },
    tick(card, t, dt) {
      const r = card.rig;
      ambient(r, t);
      const idle = (now - card.lastActive) / 1000;
      if (card.state === "waking") return;
      if (idle > 2.5 && card.state === "awake") card.state = "drowsy";
      if (idle > 7 && card.state === "drowsy") card.state = "asleep";
      card.noBlink = card.state !== "awake";
      if (card.state === "awake") {
        const sp = svgPoint(card);
        const g = sp ? gazeToward(card, sp, 0.6) : GAZE0;
        r.gx = damp(r.gx, g.x, 6, dt); r.gy = damp(r.gy, g.y, 6, dt);
        r.breathe = (1 - Math.cos((t / 3.6) * Math.PI * 2)) / 2;
        return;
      }
      const asleep = card.state === "asleep";
      // heavy lids fighting to stay open, then shut
      const lid = asleep ? 1 : 0.45 + Math.sin(t * 1.3) * 0.15 + clamp((idle - 2.5) / 4, 0, 1) * 0.2;
      r.closeL = damp(r.closeL, lid, asleep ? 1.5 : 3, dt);
      r.closeR = damp(r.closeR, lid, asleep ? 1.5 : 3, dt);
      r.gx = damp(r.gx, GAZE0.x - 1, 1, dt); r.gy = damp(r.gy, GAZE0.y + 2.5, 1, dt);
      r.bLy = damp(r.bLy, 2, 1, dt); r.bRy = damp(r.bRy, 2, 1, dt);
      const nod = asleep ? 3.5 + Math.sin(t * 0.8) * 0.6 : clamp((idle - 2.5) / 4, 0, 1) * 2.5;
      r.hr = damp(r.hr, nod, 1.2, dt);
      r.hy = damp(r.hy, nod * 1.3, 1.2, dt);
      r.breathe = (1 - Math.cos((t / (asleep ? 5.5 : 4.2)) * Math.PI * 2)) / 2 * (asleep ? 1.6 : 1);
      if (asleep && t > card.nextZ) { card.nextZ = t + 1.3; spawnZ(card); }
    },
  },
  {
    key: "shy",
    title: "Shy",
    desc: "Looks at the cursor from a distance. Get close to the face and it looks away, blushes, and the brows go worried.",
    tryText: "<b>Approach</b> the face slowly.",
    setup(card) { autoBlink(card); card.shy = 0; },
    tick(card, t, dt) {
      const r = card.rig;
      ambient(r, t);
      const sp = svgPoint(card);
      const inside = sp && sp.x >= -20 && sp.x <= 395 && sp.y >= -20 && sp.y <= 500;
      let target = 0, side = 1;
      if (inside) {
        const d = Math.hypot(sp.x - 190, sp.y - 270);
        target = 1 - clamp((d - 70) / 110, 0, 1);
        side = Math.sign(sp.x - 190) || 1;
      }
      card.shy = damp(card.shy, target, target > card.shy ? 3 : 2, dt);
      const s = ease.inOut(card.shy);
      let g = sp && inside ? gazeToward(card, sp, 0.8) : GAZE0;
      // looking away: opposite side and down
      const away = { x: GAZE0.x - side * 5, y: GAZE0.y + 2.5 };
      r.gx = damp(r.gx, lerp(g.x, away.x, s), 7, dt);
      r.gy = damp(r.gy, lerp(g.y, away.y, s), 7, dt);
      r.blush = s * 0.5;
      r.hr = -side * s * 2.5;
      r.hx = -side * s * 4;
      r.hy = s * 2;
      r.bLy = -s * 2; r.bLr = -s * 7;
      r.bRy = -s * 2; r.bRr = s * 6;
      r.closeL = s * 0.25; r.closeR = s * 0.25;
    },
  },
  {
    key: "hello",
    title: "Says hello",
    desc: "A greeting when you arrive: a quick eyebrow flash, a small nod and a smiling squint. Click and it nods yes.",
    tryText: "<b>Hover</b> onto the card, <b>click</b> for a nod.",
    setup(card) {
      autoBlink(card);
      card.busy = false;
      const r = card.rig;
      const nod = async (times, depth) => {
        for (let i = 0; i < times; i++) {
          await to(r, { hr: depth * 0.7, hy: depth }, 0.16, ease.out);
          await to(r, { hr: 0, hy: 0 }, 0.22, ease.inOut);
        }
      };
      card.stage.addEventListener("pointerenter", async () => {
        if (card.busy) return;
        card.busy = true;
        card.setChip("hey");
        // eyebrow flash: up fast, hold a beat, settle
        await to(r, { bLy: -8, bRy: -8, closeL: -0.2, closeR: -0.2 }, 0.14, ease.out3);
        await wait(0.18);
        to(r, { bLy: 0, bRy: 0, closeL: 0.5, closeR: 0.5 }, 0.3, ease.inOut);
        await nod(1, 4);
        await wait(0.6);
        to(r, { closeL: 0, closeR: 0 }, 0.4, ease.inOut);
        card.setChip("");
        card.busy = false;
      });
      card.stage.addEventListener("click", async () => {
        if (card.busy) return;
        card.busy = true;
        card.setChip("yes");
        to(r, { bLy: -3, bRy: -3, closeL: 0.3, closeR: 0.3 }, 0.2);
        await nod(2, 5);
        to(r, { bLy: 0, bRy: 0, closeL: 0, closeR: 0 }, 0.35);
        card.setChip("");
        card.busy = false;
      });
    },
    tick(card, t, dt) {
      const r = card.rig;
      ambient(r, t);
      const sp = svgPoint(card);
      const g = sp ? gazeToward(card, sp, 0.7) : GAZE0;
      r.gx = damp(r.gx, g.x, 7, dt); r.gy = damp(r.gy, g.y, 7, dt);
    },
  },
  {
    key: "depth",
    title: "Depth parallax",
    desc: "Layers move at different depths with the cursor: the waves are furthest back, then shoulders, face, and the hair with the pool nearest. Reads as a slight 3D turn.",
    tryText: "<b>Move</b> across the card.",
    setup(card) { autoBlink(card); },
    tick(card, t, dt) {
      const r = card.rig;
      ambient(r, t);
      const sp = svgPoint(card);
      const inside = sp && sp.x >= 0 && sp.x <= 375 && sp.y >= 0 && sp.y <= 480;
      const nx = inside ? clamp((sp.x - 187) / 187, -1, 1) : 0;
      const ny = inside ? clamp((sp.y - 240) / 240, -1, 1) : 0;
      const k = 5;
      r.barsX = damp(r.barsX, -nx * 6, k, dt); r.barsY = damp(r.barsY, -ny * 4, k, dt);
      r.bodyX = damp(r.bodyX, nx * 3, k, dt); r.bodyY = damp(r.bodyY, ny * 2, k, dt);
      r.hx = damp(r.hx, nx * 7, k, dt); r.hy = damp(r.hy, ny * 4.5, k, dt);
      r.hr = damp(r.hr, nx * 1.2, k, dt);
      r.hairX = damp(r.hairX, nx * 4, k, dt); r.hairY = damp(r.hairY, ny * 3, k, dt);
      const g = inside ? gazeToward(card, sp, 0.9) : GAZE0;
      r.gx = damp(r.gx, g.x, 8, dt); r.gy = damp(r.gy, g.y, 8, dt);
    },
  },
];

function spawnZ(card) {
  const ns = "http://www.w3.org/2000/svg";
  const el = document.createElementNS(ns, "text");
  el.textContent = "z";
  el.setAttribute("fill", C.white);
  el.setAttribute("font-family", "ui-monospace, Menlo, monospace");
  el.setAttribute("font-weight", "600");
  el.setAttribute("font-size", "18");
  card.els.fx.appendChild(el);
  const z = { x: 300, y: 222, s: 0.5, o: 0 };
  const apply = () => {
    el.setAttribute("transform", `translate(${f(z.x)} ${f(z.y)}) scale(${f(z.s)})`);
    el.setAttribute("opacity", f(z.o));
  };
  card.sprites.push(apply);
  to(z, { o: 1 }, 0.4);
  to(z, { x: 336 + Math.random() * 10, y: 140, s: 1.3 }, 2.6, ease.out);
  wait(1.8).then(() => to(z, { o: 0 }, 0.8)).then(() => { el.remove(); card.sprites.splice(card.sprites.indexOf(apply), 1); });
}

/* ------------------------------------------------------------------ */
/* Page                                                                */
/* ------------------------------------------------------------------ */
let pointer = null;
window.addEventListener("pointermove", (e) => (pointer = { x: e.clientX, y: e.clientY }), { passive: true });
document.documentElement.addEventListener("pointerleave", () => (pointer = null));

const grid = document.getElementById("grid");
const footer = document.getElementById("picked");
const picked = new Set();
const updateFooter = () => {
  const names = VARIANTS.map((v, i) => (picked.has(v.key) ? `${String(i).padStart(2, "0")} ${v.title}` : null)).filter(Boolean);
  footer.textContent = names.length ? `Picked: ${names.join(", ")}` : "";
  footer.classList.toggle("on", names.length > 0);
};

const cards = VARIANTS.map((v, i) => {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <div class="stage">${svgMarkup(v.key)}<span class="chip"></span></div>
    <div class="meta"><span class="num">${String(i).padStart(2, "0")}</span><h2>${v.title}</h2><button class="pick" type="button">Pick</button></div>
    <p class="desc">${v.desc}</p>
    <div class="try">${v.tryText}</div>`;
  grid.appendChild(el);
  const svg = el.querySelector("svg");
  const chip = el.querySelector(".chip");
  const card = {
    v, el, svg, stage: el.querySelector(".stage"), els: bind(svg), rig: makeRig(), cache: {}, sprites: [], visible: true,
    setChip(txt) { if (txt) chip.textContent = txt; chip.classList.toggle("on", !!txt); },
  };
  el.querySelector(".pick").addEventListener("click", () => {
    picked.has(v.key) ? picked.delete(v.key) : picked.add(v.key);
    el.classList.toggle("picked", picked.has(v.key));
    el.querySelector(".pick").textContent = picked.has(v.key) ? "Picked" : "Pick";
    updateFooter();
  });
  v.setup(card);
  return card;
});

const io = new IntersectionObserver((entries) => entries.forEach((en) => {
  const c = cards.find((c) => c.el === en.target);
  if (c) c.visible = en.isIntersecting;
}));
cards.forEach((c) => io.observe(c.el));

let last = performance.now();
const t0 = last;
function frame(ts) {
  now = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  stepTweens();
  const t = (ts - t0) / 1000;
  for (const c of cards) {
    if (!c.visible) continue;
    c.v.tick(c, t, dt);
    c.sprites.forEach((s) => s());
    render(c.rig, c.els, c.cache);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
